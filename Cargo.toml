
[package]
name = "gh2qdrant"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
uuid = { version = "1", features = ["v5"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[profile.release]
opt-level = 2
